<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* цвет: плоский, без градиентов */
    --bg: #0E0916;
    --surface: #181022;
    --glass: rgba(24, 16, 34, .6);  /* панели поверх страницы: сквозь них виден размытый фон */
    --rule: #3B2E4D;
    --text: #F3EFF8;
    --text2: #BDB3CF;
    --rose: #E5608F;
    --gold: #D4B47A;
    --on-rose: #0E0916;
    /* отступы: единственная шкала, кратная 4 */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    /* шкала шрифтов */
    --t-meta: 13px; --t-body: 15px; --t-lead: 18px; --t-h2: 24px; --t-h1: 32px;
    --display: "Forum", "Georgia", serif;
    --sans: "Golos Text", system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0 auto; max-width: 560px; padding: var(--s5) var(--s4) calc(var(--s7) + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text); font: 400 var(--t-body)/1.5 var(--sans);
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* фоновая картинка: крупный силуэт, едва заметный */
  main { position: relative; z-index: 1; }
  .backdrop { position: fixed; inset: 0; margin-inline: auto; max-width: 560px; overflow: hidden; pointer-events: none; z-index: 0; }
  .backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .24; }
  /* header */
  .letter { display: grid; grid-template-columns: 80px 1fr; gap: var(--s4); align-items: start; }
  .letter .gem { width: 80px; height: 80px; }
  .letter .gem img { object-position: center 20%; }
  h1 { margin: 0 0 var(--s2); font: 400 var(--t-h1)/1.1 var(--display); }
  .letter p { margin: 0; max-width: 40ch; color: var(--text2); }
  .letter b { font-weight: 600; color: var(--text); }
  .letter .note { margin-top: var(--s2); font-size: var(--t-meta); opacity: .75; }

  h2 { margin: var(--s7) 0 var(--s1); font: 400 var(--t-h2)/1.2 var(--display); }
  .note { margin: 0 0 var(--s4); color: var(--text2); font-size: var(--t-meta); max-width: 46ch; }
  .rule { height: 1px; background: var(--rule); margin: var(--s3) 0 var(--s4); }

  /* дни: грани */
  svg { display: block; width: 100%; height: auto; }
  .vinyl .disc { fill: none; stroke: var(--rule); stroke-width: 1.5; }
  .vinyl .groove { fill: none; stroke: var(--rule); stroke-width: 1; }
  .vinyl .label { fill: var(--rule); }
  .vinyl.l1 .disc { fill: #5A2A44; stroke: #8A3B63; }
  .vinyl.l1 .groove { stroke: #8A3B63; }
  .vinyl.l1 .label { fill: #8A3B63; }
  .vinyl.l2 .disc { fill: #9C3F69; stroke: var(--rose); }
  .vinyl.l2 .groove { stroke: var(--rose); }
  .vinyl.l2 .label { fill: var(--rose); }
  .vinyl.l3 .disc { fill: var(--rose); stroke: var(--rose); }
  .vinyl.l3 .groove { stroke: var(--on-rose); opacity: .45; }
  .vinyl.l3 .label { fill: var(--gold); }
  .vinyl.today .disc { stroke: var(--gold); stroke-width: 2.5; }
  .axis { display: flex; justify-content: space-between; margin-top: var(--s2); color: var(--text2); font-size: var(--t-meta); }

  /* часы */
  .clock { max-width: 220px; margin-inline: auto; }
  .tick { stroke: var(--rule); stroke-width: 2.5; stroke-linecap: round; }
  .tick.on { stroke: var(--rose); }
  .tick.peak { stroke: var(--gold); }
  .hr { fill: var(--text2); font: 400 10px var(--sans); text-anchor: middle; }
  .peak-t { fill: var(--text); font: 400 28px var(--display); text-anchor: middle; }
  .clock p { margin: 0; color: var(--text2); font-size: var(--t-meta); }

  /* списки */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: grid; grid-template-columns: var(--s5) 1fr auto; gap: var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: 1px solid var(--rule); }
  .list li:last-child { border-bottom: 1px solid var(--rule); }
  .list.plain li { grid-template-columns: 1fr auto; }
  .rank { font: 400 var(--t-lead)/1 var(--display); color: var(--gold); }
  .nm { overflow-wrap: anywhere; font-weight: 500; }
  .sb { display: block; font-weight: 400; color: var(--text2); font-size: var(--t-meta); }
  .ct { color: var(--text2); font-size: var(--t-meta); white-space: nowrap; }

  /* дары */
  .gifts { display: flex; gap: var(--s4); overflow-x: auto; margin-inline: calc(var(--s4) * -1); padding: var(--s1) var(--s4) var(--s3); scrollbar-width: none; }
  .gifts::-webkit-scrollbar { display: none; }
  .gift { flex: none; width: 136px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .cut8 { clip-path: polygon(16% 0, 84% 0, 100% 16%, 100% 84%, 84% 100%, 16% 100%, 0 84%, 0 16%); }
  .gem { width: 136px; height: 136px; padding: 2px; background: var(--gold); }
  .gem > div { width: 100%; height: 100%; background: var(--surface); }
  .gem img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gift .t { margin-top: var(--s3); font: 400 var(--t-lead)/1.2 var(--display); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gift .a { margin-top: var(--s1); color: var(--text2); font-size: var(--t-meta); }

  .empty, .err { padding: var(--s5) 0; font: 400 var(--t-lead)/1.4 var(--display); color: var(--text2); }
  .err { color: var(--rose); }

  /* окно трека */
  .shade { position: fixed; inset: 0; background: rgba(5, 3, 9, .5); opacity: 0; pointer-events: none; z-index: 10; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin-inline: auto; max-width: 560px;
    background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 2px solid var(--gold);
    clip-path: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    padding: var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto;
    transform: translateY(105%);
  }
  .sheet.on { transform: none; }
  @media (prefers-reduced-motion: no-preference) { .sheet { transition: transform .25s ease-out; } }
  .head { display: grid; grid-template-columns: 80px 1fr; gap: var(--s4); align-items: center; }
  .head .gem { width: 80px; height: 80px; }
  .head .t { font: 400 var(--t-h2)/1.15 var(--display); overflow-wrap: anywhere; }
  .head .a { margin-top: var(--s1); color: var(--text2); }
  .why { margin-top: var(--s2); color: var(--gold); font-size: var(--t-meta); }
  .status { min-height: 24px; margin: var(--s4) 0 var(--s2); color: var(--text2); }
  .status.ok { color: var(--text); }
  .status.bad { color: var(--rose); }
  .vers { margin: 0 0 var(--s3); padding: 0; list-style: none; }
  .ver { display: grid; grid-template-columns: var(--s4) 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--rule); cursor: pointer; }
  .ver .mk { width: 14px; height: 14px; border: 1.5px solid var(--text2); border-radius: 50%; justify-self: center; }
  .ver.sel .mk { background: var(--rose); border-color: var(--rose); box-shadow: inset 0 0 0 3px var(--surface); }
  .ver .vt { overflow-wrap: anywhere; font-weight: 500; }
  .ver.sel .vt { color: var(--text); }
  .ver .vs { display: block; color: var(--text2); font-size: var(--t-meta); font-weight: 400; }
  .ver .vd { color: var(--text2); font-size: var(--t-meta); white-space: nowrap; }
  .mini { display: grid; grid-template-columns: 44px 1fr 48px 48px; gap: var(--s3); align-items: center; margin: var(--s3) 0; padding: var(--s3) 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .mini .disc svg { width: 44px; height: 44px; }
  .mini .seek { margin-top: 0; }
  .mini .ico.main { width: 48px; height: 48px; }
  .mini .ico.main svg { width: 24px; height: 24px; }
  @media (prefers-reduced-motion: no-preference) { .mini.playing .disc svg { animation: spin 6s linear infinite; } }
  .primary { display: block; width: 100%; padding: var(--s4); border: 0; background: var(--rose); color: var(--on-rose); font-weight: 600; font-size: var(--t-body); cursor: pointer; }
  .alt { display: grid; grid-template-columns: 1fr 1fr; margin-top: var(--s3); border-top: 1px solid var(--rule); }
  .alt button { padding: var(--s4) var(--s2); border: 0; background: none; color: var(--text); font-weight: 500; cursor: pointer; }
  .alt button + button { border-left: 1px solid var(--rule); }
  button:disabled { opacity: .4; cursor: default; }
  button[hidden] { display: none; }

  /* профиль и избранное */
  .avatar { display: block; padding: 0; border: 0; background: none; cursor: pointer; }
  .field { display: block; width: 100%; padding: var(--s3) var(--s4); border: 1px solid var(--rule); border-radius: 0; background: var(--bg); color: var(--text); font: inherit; }
  .fld-label { display: block; margin: var(--s4) 0 var(--s2); color: var(--text2); font-size: var(--t-meta); }
  .welcome { padding-top: var(--s7); }
  .welcome h1 { margin-bottom: var(--s5); }
  .welcome .primary { margin-top: var(--s4); }
  .textbtn { display: block; width: 100%; margin-top: var(--s3); padding: var(--s4) var(--s2); border: 0; border-top: 1px solid var(--rule); background: none; color: var(--text); font-weight: 500; cursor: pointer; }
  .favrow { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: baseline; width: 100%; padding: var(--s3) 0; border: 0; border-top: 1px solid var(--rule); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .favlist .favrow:last-child { border-bottom: 1px solid var(--rule); }
  /* над списком слева: «Mix» и повтор; сдвиг влево ставит значок вровень с текстом (значок 24 в кнопке 48) */
  .favtools { display: flex; gap: var(--s1); margin: 0 0 var(--s1) -12px; }
  .favtools[hidden] { display: none; }
  .favrow.now .nm { color: var(--rose); }
  .favrow.now .nm::before { content: "▶"; display: inline-block; width: 1.2em; font-size: .75em; vertical-align: .1em; }

  /* плейлист любимого: быстрая кнопка и плеер внизу */
  .quick { margin-top: var(--s5); }
  .nowbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; margin-inline: auto; max-width: 560px; padding: var(--s4) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom)); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 2px solid var(--gold); clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
  .nowbar[hidden] { display: none; }
  .nowtop { display: grid; grid-template-columns: 52px 1fr 44px; gap: var(--s3); align-items: center; }
  .disc svg { display: block; width: 52px; height: 52px; }
  .dsc { fill: var(--rose); }
  .dgr { fill: none; stroke: var(--on-rose); stroke-width: 1; opacity: .4; }
  .dlb { fill: var(--gold); }
  .dho { fill: var(--surface); }
  .dsh { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; opacity: .6; }
  @media (prefers-reduced-motion: no-preference) {
    .nowbar.playing .disc svg { animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
  .nowinfo { min-width: 0; }
  .nowt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--t-lead)/1.2 var(--display); }
  .nows { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); font-size: var(--t-meta); }
  .seek { position: relative; height: 28px; margin-top: var(--s3); }
  .seek::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: var(--rule); }
  .seekfill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; background: var(--rose); }
  .seekdot { position: absolute; top: 7px; left: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--gold); pointer-events: none; }
  .seekin { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .seek:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
  .times { display: flex; justify-content: space-between; color: var(--text2); font-size: var(--t-meta); }
  .ctrl { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; justify-items: center; margin-top: var(--s2); }
  .ctrl .tog { justify-self: end; }
  .ctrl .tog:first-child { justify-self: start; }  /* «Mix» слева, повтор справа */
  .ico { display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; }
  .ico svg { width: 24px; height: 24px; fill: currentColor; }
  .ico.main { width: 60px; height: 60px; border-radius: 50%; background: var(--rose); color: var(--on-rose); }
  .ico.main svg { width: 28px; height: 28px; }
  .ico.quiet { color: var(--text2); }
  .ico.tog { position: relative; color: var(--text2); }
  .ico.tog svg { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.tog[aria-pressed="true"] { color: var(--rose); }
  .ico.tog[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
  .nowmsg { min-height: 20px; margin-top: var(--s2); color: var(--text2); font-size: var(--t-meta); text-align: center; }
  .nowbar .textbtn { margin-top: var(--s2); padding-block: var(--s3); }
  body.withbar { padding-bottom: calc(300px + env(safe-area-inset-bottom)); }
  body.withbar.barmin { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  /* верх плеера: «свернуть» и «закрыть» рядом */
  .nowtop { grid-template-columns: 52px 1fr auto; }
  .nowtools { display: flex; }
  .nowtools .ico { width: 44px; height: 44px; }
  .ico.fav.on { color: var(--rose); }
  .ico.fav.on svg path { fill: currentColor; }  /* в избранном — звезда закрашена */
  /* свёрнутый плеер: тонкая полоса с прогрессом, кнопкой и названием; нажатие на название раскрывает его */
  .nowmini { display: none; }
  .nowbar.min { padding: 0 var(--s3) env(safe-area-inset-bottom); clip-path: none; }
  .nowbar.min > :not(.nowmini) { display: none; }
  .nowbar.min .nowmini { position: relative; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 48px; }
  .minline { position: absolute; left: 0; top: -2px; height: 2px; width: 0; background: var(--rose); }
  .ico.small { width: 44px; height: 44px; }
  .ico.small svg { width: 22px; height: 22px; }
  .nowmini .mt { min-width: 0; overflow: hidden; padding: 0 var(--s2); border: 0; background: none; color: var(--text);
    font: inherit; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  /* строки дашборда, которые можно нажать */
  .list li.pick { cursor: pointer; }
  .list li.pick:hover .nm, .list li.pick:focus-visible .nm,
  .favrow:hover .nm, .favrow:focus-visible .nm { color: var(--rose); }
  .list li.pick:focus-visible, .favrow:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app"><div class="empty">Loading…</div></main>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0E0916"); tg.setBackgroundColor("#0E0916"); } catch (e) {}
}

const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const plural = (n, one, many) => n === 1 ? one : many;
const tracks = n => `${n} ${plural(n, "track", "tracks")}`;
const mmss = s => s ? `${Math.floor(s / 60)}:${pad(Math.round(s % 60))}` : "";
const hoursText = s => s >= 3600 ? `${(s / 3600).toFixed(1)} h` : `${Math.max(1, Math.round(s / 60))} min`;
const dateShort = dt => dt.toLocaleDateString("en-GB", { day: "numeric", month: "short" });

// profile, favorites and loaded data live here; render() draws the page from it
const state = { name: "", tgName: "", avatar: null, bg: null, favs: [], d: null, recs: [] };
const norm = s => (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
const isFav = r => state.favs.some(f => f.key === norm(r.artist) + norm(r.title));

async function api(path) {
  const r = await fetch(path, { headers: { "X-Init-Data": tg ? tg.initData : "" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", body: JSON.stringify(body),
    headers: { "X-Init-Data": tg ? tg.initData : "", "Content-Type": "application/json" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// images: full-screen background and small portrait next to the title
function backdrop() {
  const box = $("div", "backdrop"), img = $("img");
  box.setAttribute("aria-hidden", "true"); img.alt = ""; img.src = state.bg || "/static/Diamond.jpg";
  box.append(img); return box;
}
function setBackdrop() { const i = document.querySelector(".backdrop img"); if (i) i.src = state.bg || "/static/Diamond.jpg"; }
function avatar() {
  const btn = $("button", "avatar"), g = $("div", "gem cut8"), inner = $("div", "cut8"), img = $("img");
  btn.setAttribute("aria-label", "Edit profile");
  img.alt = "Profile photo"; img.src = state.avatar || "/static/Diamond.jpg"; inner.append(img); g.append(inner); btn.append(g);
  btn.onclick = openProfile;
  return btn;
}

function section(title, note, node) {
  const f = document.createDocumentFragment();
  f.append($("h2", null, title));
  if (note) f.append($("p", "note", note));
  f.append(node);
  return f;
}

function streak(days) {
  let n = 0; const d = new Date();
  if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function letter(d) {
  const wrap = $("div", "letter"), body = $("div"), p = $("p");  // avatar (a button) opens the profile sheet
  body.append($("h1", null, state.name ? `Your Music, ${state.name}` : "Your Music"));
  if (!d.total) p.textContent = "No activity yet.";
  else {
    const st = streak(d.days);
    const add = (t, b) => { if (t) p.append(document.createTextNode(t)); if (b) p.append($("b", null, b)); };
    add("", tracks(d.total));
    add(", ", hoursText(d.seconds));
    add(" listened.");
    if (st > 1) { add(" Streak: "); add("", `${st} days`); add("."); }
  }
  body.append(p, $("p", "note", "Tap your photo to change the picture and background.")); wrap.append(avatar(), body);
  return wrap;
}

// one day as a vinyl record: outer disc, groove ring, centre label
function vinyl(cx, cy, r, cls) {
  const g = svg("g", { class: "vinyl" + (cls ? " " + cls : "") });
  g.append(svg("circle", { class: "disc", cx, cy, r }),
           svg("circle", { class: "groove", cx, cy, r: r * 0.64 }),
           svg("circle", { class: "label", cx, cy, r: r * 0.3 }));
  return g;
}

function daysGrid(days) {
  const cols = 10, rows = 3, step = 32, r = 13;
  const s = svg("svg", { viewBox: `0 0 ${cols * step} ${rows * step}`, role: "img", "aria-label": "Activity over the last 30 days" });
  const vals = [], dates = [];
  for (let i = 29; i >= 0; i--) { const dt = new Date(); dt.setDate(dt.getDate() - i); dates.push(dt); vals.push(days[dayKey(dt)] || 0); }
  const max = Math.max(1, ...vals);
  vals.forEach((v, i) => {
    const lvl = v === 0 ? 0 : Math.min(3, 1 + Math.floor((v / max) * 2.99));
    const p = vinyl((i % cols) * step + step / 2, Math.floor(i / cols) * step + step / 2, r, `${lvl ? "l" + lvl : ""}${i === 29 ? " today" : ""}`.trim());
    const t = svg("title", {}); t.textContent = `${dateShort(dates[i])}: ${tracks(v)}`;
    p.append(t); s.append(p);
  });
  const wrap = $("div"), axis = $("div", "axis");
  axis.append($("span", null, "30 days ago"), $("span", null, "Today"));

// favorites are kept on the server after the first download, so this answers at once on every later play;
// other songs (Top tracks, Recent, an artist's songs) come by their saved YouTube link or are found by name
function trackUrl(i) {
  const it = player.items[i];
  if (!it) return Promise.reject(new Error("end"));
  const body = { artist: it.artist, title: it.title, duration: it.duration || 0, cover: it.cover || "" };
  if (!player.cache[i]) player.cache[i] = (it.kind === "fav" ? post("/api/favplay", body)
    : post("/api/track", { ...body, url: it.url || "" })).then(r => r.url);
  return player.cache[i];
}

async function playAt(i) {
  const my = ++player.token, it = player.items[i];
  if (!it) { stopPlayer(); return; }
  player.i = i;
  setNow(it, "Loading…");
  markNow();
  try {
    const url = await trackUrl(i);
    if (my !== player.token) return;
    player.au.src = url;
    if (sheetAu) sheetAu.pause();
    let blocked = false;
    await player.au.play().catch(() => { blocked = true; });  // a page opened by the bot may need one tap before sound is allowed
    setNow(it, blocked ? "Tap play to start." : "");
    if (i + 1 < player.items.length) trackUrl(i + 1).catch(() => { delete player.cache[i + 1]; });  // get the next track ready while this one plays
  } catch (e) {
    delete player.cache[i];
    if (my !== player.token) return;
    setNow(it, "Could not load this track. Skipping…");
    setTimeout(() => { if (my === player.token) playAt(i + 1); }, 1500);
  }
}

// the bot's "Play all", "Shuffle" and numbered buttons open this page as /?play=favorites|shuffle[&i=N] and the queue starts by itself
let autoplayDone = false;
function maybeAutoplay() {
  if (autoplayDone || !state.name || !state.favs.length) return;
  const q = new URLSearchParams(location.search), mode = q.get("play");
  if (!mode) return;
  autoplayDone = true;
  if (mode === "shuffle") startFavorites(true);
  else startFavorites(false, Math.max(0, (parseInt(q.get("i"), 10) || 1) - 1));
}

// start = null: the whole list (shuffled with mix); start = N: song N first, then the rest in order or mixed
function startFavorites(shuffle, start = null) {
  startQueue(state.favs.map(f => ({ ...f, kind: "fav" })), shuffle, start);
}

function startQueue(list, shuffle, start = null) {
  if (!list.length) return;
  const at = Math.min(Math.max(0, start ?? 0), list.length - 1);
  let items = list.slice(), first = at;
  if (shuffle && start === null) { items = shuffled(items); first = 0; }
  else if (shuffle) { items = [list[at], ...shuffled(list.filter((_, k) => k !== at))]; first = 0; }
  Object.assign(player, { items, base: list.slice(), cache: {} });
  if (sheetOpen) closeSheet();  // a track sheet must not keep its own player going over the queue
  ensurePlayerBar();
  // favorites can be handed to the chat as a queue; any other song opens its sheet (versions, save file, send to chat)
  player.els.hand.textContent = list[0].kind === "fav" ? "Continue in chat" : "Save file or send to chat";
  player.au.src = SILENT; player.au.play().catch(() => {});  // the tap unlocks audio, so the next tracks can start by themselves
  // closing the page ends playback, so ask before it closes while music is on
  if (tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
  playAt(first);
}

// A closed page cannot play sound. Telegram's own player can, so hand the queue over to the chat.
async function handOff() {
  const e = player.els, start = Math.max(0, player.i), rest = player.items.slice(start, start + 10);
  if (!rest.length) return;
  e.hand.disabled = true; e.msg.textContent = "Sending to chat…";
  try {
    const r = await post("/api/handoff", { items: rest.map(x => ({ artist: x.artist, title: x.title })) });
    player.au.pause();
    e.msg.textContent = `${r.sent} ${plural(r.sent, "track", "tracks")} sent to chat. Tap the first one there and it keeps playing after you close the app.`;
  } catch (err) { e.msg.textContent = "Could not send to chat."; }

function stopPlayer() {
  player.token++;

  if (player.bar) player.bar.hidden = true;
  document.body.classList.remove("withbar", "barmin");
  markNow();
  if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
}

// any picture -> JPEG up to `max` px on the longer side; the server crops it to a square.
// If the browser cannot decode the file (rare formats), the original goes to the server, whose ffmpeg reads far more formats.
function resizeImage(file, max) {
  const raw = () => file;
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) throw new Error("size");
        const k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        const g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);  // transparent areas become dark instead of random
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => resolve(b || raw()), "image/jpeg", 0.88);
      } catch (e) { URL.revokeObjectURL(url); resolve(raw()); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(raw()); };
    img.src = url;
  });
}

/* окно трека */
const shade = $("div", "shade"), sheet = $("div", "sheet");
sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true"); sheet.setAttribute("aria-label", "Track");
document.body.append(shade, sheet);
shade.onclick = () => closeSheet();
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let sheetAu = null;
// A swipe or the Back key must close the sheet first and leave the app only on the next one:
// opening pushes a history entry, and Telegram's own Back button is shown while the sheet is up.
let sheetOpen = false;
function showSheet() {
  shade.classList.add("on"); sheet.classList.add("on");
  if (sheetOpen) return;
  sheetOpen = true;
  try { history.pushState({ sheet: 1 }, ""); } catch (e) {}
  if (tg && tg.BackButton) tg.BackButton.show();
}
function closeSheet(fromHistory) {
  shade.classList.remove("on"); sheet.classList.remove("on"); if (sheetAu) sheetAu.pause();
  if (!sheetOpen) return;
  sheetOpen = false;
  if (tg && tg.BackButton) tg.BackButton.hide();
  if (fromHistory !== true && history.state && history.state.sheet) history.back();
}
window.addEventListener("popstate", () => { if (sheetOpen) closeSheet(true); });
if (tg && tg.BackButton) tg.BackButton.onClick(() => closeSheet());

// compact player for a track opened from the lists: same look as the bottom player, no browser controls
function miniPlayer(src) {
  const au = new Audio(); au.preload = "auto"; au.src = src;
  const box = $("div", "mini"), disc = $("div", "disc"), mid = $("div"), main = iconButton("play", "Play", "main"), loop = repeatButton();
  const seek = $("div", "seek"), fill = $("div", "seekfill"), dot = $("div", "seekdot"), range = $("input", "seekin");
  const times = $("div", "times"), cur = $("span", null, "0:00"), dur = $("span", null, "");
  range.type = "range"; range.min = 0; range.max = 1000; range.value = 0; range.setAttribute("aria-label", "Seek");
  disc.append(discSvg()); seek.append(fill, dot, range); times.append(cur, dur); mid.append(seek, times);
  box.append(disc, mid, loop, main);
  const shown = () => {
    const p = au.duration ? au.currentTime / au.duration : 0;
    fill.style.width = dot.style.left = `${p * 100}%`;
    range.value = Math.round(p * 1000); cur.textContent = tm(au.currentTime); dur.textContent = au.duration ? tm(au.duration) : "";
  };
  const on = v => { box.classList.toggle("playing", v); main.replaceChildren(icon(v ? "pause" : "play")); main.setAttribute("aria-label", v ? "Pause" : "Play"); };
  au.addEventListener("timeupdate", shown); au.addEventListener("durationchange", shown);
  au.addEventListener("play", () => { on(true); if (player.au && player.au !== au) player.au.pause(); });  // one sound at a time
  au.addEventListener("pause", () => on(false)); au.addEventListener("ended", () => { au.currentTime = 0; if (repeat.on) au.play().catch(() => {}); else on(false); });
  main.onclick = () => au.paused ? au.play().catch(() => {}) : au.pause();
  range.oninput = () => { if (au.duration) au.currentTime = au.duration * range.value / 1000; };
  return { box, au };
}

async function openTrack(rec) {
  sheet.replaceChildren();
  showSheet();
  const head = $("div", "head"), info = $("div");
  info.append($("div", "t", rec.title), $("div", "a", rec.artist));
  if (rec.because) info.append($("div", "why", `Because you listen to ${rec.because}`));
  head.append(gem(rec.cover), info);
  const status = $("div", "status", "Finding versions…"); status.setAttribute("role", "status");
  const list = $("ul", "vers"), slot = $("div");
  if (sheetAu) { sheetAu.pause(); sheetAu = null; }
  const play = $("button", "primary", "Play"), alt = $("div", "alt");
  const save = $("button", null, "Save file"), chat = $("button", null, "Send to chat");
  alt.append(save, chat);
  [play, save, chat].forEach(b => b.disabled = true);
  sheet.append(head, status, list, slot, play, alt);

  let current = null, busy = false;
  const setStatus = (t, cls) => { status.className = "status" + (cls ? " " + cls : ""); status.textContent = t; };
  const lock = on => { busy = on; [play, save, chat].forEach(b => b.disabled = on || !current); };
  const getFile = () => { setStatus("Downloading…"); return post("/api/fetch", { vid: current.vid, mode: "file" }); };
  const failed = () => setStatus("Download failed. Try another version.", "bad");

  const favLabel = () => isFav(rec) ? "Remove from favorites" : "Add to favorites";
  const fav = $("button", "textbtn", favLabel());
  sheet.append(fav);
  fav.onclick = async () => {
    fav.disabled = true;
    try {
      const r = await post("/api/favorites", { op: isFav(rec) ? "remove" : "add", artist: rec.artist, title: rec.title,
        duration: rec.duration || 0, cover: rec.cover || "", vid: current ? current.vid : "" });
      state.favs = r.favorites; fav.textContent = favLabel(); renderFavs();
    } catch (e) { setStatus("Could not update favorites.", "bad"); }
    fav.disabled = false;
  };

  play.onclick = async () => {
    if (busy) return;
    if (sheetAu) sheetAu.pause();  // two players must not sound at once
    if (current.stream) {
      // the server streams while the file is still downloading, so sound starts in about a second;
      // if this WebView cannot play the stream, fall back to the whole file
      slot.replaceChildren();
      const mp = miniPlayer(current.stream), v = current; sheetAu = mp.au; slot.append(mp.box);
      setStatus("Loading…");
      let started = false, fellBack = false, blocked = false;
      const fallback = async () => {
        if (started || fellBack || blocked || current !== v || sheetAu !== mp.au) return;
        fellBack = true; clearTimeout(stall);
        lock(true);
        try { const f = await getFile(); mp.au.src = f.url; setStatus("Ready.", "ok"); mp.au.play().catch(() => setStatus("Press play to start.", "ok")); }
        catch (e) { failed(); }
        lock(false);
      };
      // some WebViews neither play nor report an error on a stream; do not leave "Loading…" up forever
      let stall = setTimeout(fallback, 7000);
      mp.au.addEventListener("play", () => {  // the user pressed play after autoplay was blocked: watch the stream again
        if (blocked && !started) { blocked = false; setStatus("Loading…"); stall = setTimeout(fallback, 7000); }
      });
      mp.au.addEventListener("playing", () => { started = true; clearTimeout(stall); setStatus(""); }, { once: true });
      mp.au.addEventListener("error", fallback, { once: true });
      mp.au.play().catch(e => {
        if (e && e.name === "NotAllowedError") { blocked = true; clearTimeout(stall); setStatus("Press play to start.", "ok"); }
      });
      return;
    }
    lock(true);
    try {
      const f = await getFile();
      slot.replaceChildren();
      const mp = miniPlayer(f.url); sheetAu = mp.au; slot.append(mp.box);
      setStatus("Ready.", "ok");
      mp.au.play().catch(() => setStatus("Press play to start.", "ok"));
    } catch (e) { failed(); }
    lock(false);
  };
  save.onclick = async () => {
    if (busy) return; lock(true);
    try {
      const f = await getFile();
      const url = location.origin + f.url, name = `${f.artist ? f.artist + " - " : ""}${f.title}.${f.ext}`;
      if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.downloadFile) { tg.downloadFile({ url, file_name: name }); setStatus("Download started.", "ok"); }
      else if (tg) { tg.openLink(url); setStatus("Opening file in browser.", "ok"); }
      else { window.open(url, "_blank"); setStatus("Opening file.", "ok"); }
    } catch (e) { failed(); }
    lock(false);
  };
  chat.onclick = async () => {
    if (busy) return; lock(true); setStatus("Sending…");
    try { await post("/api/fetch", { vid: current.vid, mode: "chat" }); setStatus("Sent to chat.", "ok"); }
    catch (e) { failed(); }
    lock(false);
  };

  const select = (v, row) => {
    current = v; slot.replaceChildren(); if (sheetAu) sheetAu.pause();
    list.querySelectorAll(".ver").forEach(r => { r.classList.remove("sel"); r.setAttribute("aria-checked", "false"); });
    row.classList.add("sel"); row.setAttribute("aria-checked", "true");
    setStatus(""); lock(false);
  };

  try {
    const r = await post("/api/resolve", { artist: rec.artist, title: rec.title, duration: rec.duration || 0 });
    if (!r.items.length) { setStatus("No source found for this track.", "bad"); return; }
    setStatus("");
    list.setAttribute("role", "radiogroup");
    r.items.forEach((v, i) => {
      const row = $("li", "ver"), box = $("div", "vt");
      row.tabIndex = 0; row.setAttribute("role", "radio");
      box.append(document.createTextNode(v.title), $("span", "vs", v.artist || ""));
      row.append($("span", "mk"), box, $("span", "vd", mmss(v.duration)));
      row.onclick = () => { if (!busy) select(v, row); };
      row.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !busy) { e.preventDefault(); select(v, row); } };
      list.append(row);
      if (i === 0) select(v, row);
    });
  } catch (e) { setStatus("Could not load versions. Try again.", "bad"); }
}

// a recommendation plays at once in the bottom player, then the next ones (like favorites)
function gifts(items) {
  const strip = $("div", "gifts"), songs = asTracks(items);
  items.forEach((it, i) => {
    const b = $("button", "gift");
    b.append(gem(it.cover), $("div", "t", it.title), $("div", "a", it.artist));
    b.setAttribute("aria-label", `Play ${it.title}, ${it.artist}`);
    b.onclick = () => startQueue(songs, mix.on, i);
    strip.append(b);
  });
  return strip;
}

// profile sheet: change photo and name
function openProfile() {
  sheet.replaceChildren();
  showSheet();
  const head = $("div", "head"), info = $("div"), g =$("div", "gem cut8"), inner = $("div", "cut8"), img = $("img");
  img.alt = ""; img.src = state.avatar || "/static/Diamond.jpg"; inner.append(img); g.append(inner);
  info.append($("div", "t", "Profile"));
  head.append(g, info);
  const file = $("input"); file.type = "file"; file.accept = "image/*,.heic,.heif,.avif,.webp,.bmp,.gif,.tif,.tiff"; file.hidden = true;
  const change = $("button", "textbtn", "Change photo");
  const bgFile = $("input"); bgFile.type = "file"; bgFile.accept = file.accept; bgFile.hidden = true;
  const bgChange = $("button", "textbtn", "Change background"), bgReset = $("button", "textbtn", "Reset background");
  bgReset.hidden = !state.bg;
  const label = $("label", "fld-label", "Name");
  const input = $("input", "field"); input.type = "text"; input.maxLength = 30; input.value = state.name; input.autocomplete = "off";
  input.id = "profile-name"; label.htmlFor = input.id;
  const status = $("div", "status"); status.setAttribute("role", "status");
  const save = $("button", "primary", "Save");
  sheet.append(head, change, file, bgChange, bgReset, bgFile, label, input, status, save);
  const setStatus = (t, cls) => { status.className = "status" + (cls ? " " + cls : ""); status.textContent = t; };

  // the big picture behind the page: any image, cropped to fit the screen
  const sendBg = async blob => {
    const r = await fetch("/api/background", { method: "POST", body: blob,
      headers: { "X-Init-Data": tg ? tg.initData : "", "Content-Type": "application/octet-stream" } });
    if (!r.ok) throw new Error(r.status);
    state.bg = (await r.json()).bg; setBackdrop(); bgReset.hidden = !state.bg;
  };
  bgChange.onclick = () => bgFile.click();
  bgFile.onchange = async () => {
    const f = bgFile.files[0]; if (!f) return;
    bgChange.disabled = true; setStatus("Uploading background…");
    try {
      const blob = await resizeImage(f, 1600);
      if (blob.size > 20 * 1024 * 1024) setStatus("This file is too large.", "bad");
      else { await sendBg(blob); setStatus("Background updated.", "ok"); }
    } catch (e) { setStatus("Could not upload the background.", "bad"); }
    bgChange.disabled = false; bgFile.value = "";
  };
  bgReset.onclick = async () => {
    bgReset.disabled = true;
    try { await sendBg(new Blob([])); setStatus("Background reset.", "ok"); }
    catch (e) { setStatus("Could not reset the background.", "bad"); }
    bgReset.disabled = false;
  };

  change.onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    change.disabled = true; setStatus("Uploading photo…");
    try {
      const blob = await resizeImage(f, 384);
      if (blob.size > 20 * 1024 * 1024) { setStatus("This file is too large.", "bad"); change.disabled = false; file.value = ""; return; }
      const r = await fetch("/api/avatar", { method: "POST", body: blob,
        headers: { "X-Init-Data": tg ? tg.initData : "", "Content-Type": "application/octet-stream" } });
      if (!r.ok) throw new Error(r.status);
      state.avatar = (await r.json()).avatar;
      img.src = state.avatar;
      document.querySelectorAll(".avatar img").forEach(i => { i.src = state.avatar; });
      setStatus("Photo updated.", "ok");
    } catch (e) { setStatus("Could not upload the photo.", "bad"); }
    change.disabled = false; file.value = "";
  };
  const submit = async () => {
    const name = input.value.trim();
    if (!name) { setStatus("Enter a name.", "bad"); return; }
    save.disabled = true;
    try { await post("/api/profile", { name }); state.name = name; render(); closeSheet(); }
    catch (e) { setStatus("Could not save. Try again.", "bad"); }
    save.disabled = false;
  };
  save.onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
}

// first launch: ask for a name
function welcome() {
  const box = $("div", "welcome"), input = $("input", "field"), status = $("div", "status"), go = $("button", "primary", "Continue");
  input.type = "text"; input.maxLength = 30; input.autocomplete = "off"; input.placeholder = state.tgName || "Name"; input.id = "welcome-name";
  const label = $("label", "fld-label", "What should we call you?"); label.htmlFor = input.id;
  status.setAttribute("role", "status");
  box.append($("h1", null, "Welcome"), label, input, status, go);
  const submit = async () => {
    const name = input.value.trim();
    if (!name) { status.className = "status bad"; status.textContent = "Enter a name."; return; }
    go.disabled = true;
    try { await post("/api/profile", { name }); state.name = name; render(); maybeAutoplay(); }
    catch (e) { status.className = "status bad"; status.textContent = "Could not save. Try again."; go.disabled = false; }
  };
  go.onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
  document.getElementById("app").replaceChildren(box);
  input.focus();
}

function render() {
  const root = document.getElementById("app"), d = state.d, page = document.createDocumentFragment();
  page.append(letter(d), quickBox(), section("My Favorites", null, favBox()));
  if (d.total) {
    page.append(
      section("Activity", null, daysGrid(d.days)),
      section("Listening hours", null, clock(d.hours)));
    if (d.top_artists.length) page.append(section("Top artists", null,
      ranked(d.top_artists, x => x.artist, x => hoursText(x.seconds), x => tracks(x.plays),
        i => openArtist(d.top_artists[i].artist), x => `Songs by ${x.artist}`)));
    if (d.top_tracks.length) page.append(section("Top tracks", null,
      ranked(d.top_tracks, x => x.title, x => x.artist, x => `${x.plays} ${plural(x.plays, "play", "plays")}`,
        i => startQueue(asTracks(d.top_tracks), mix.on, i), x => `Play ${x.title}, ${x.artist}`)));
    page.append(section("Recent", null, recent(d.recent, i => startQueue(asTracks(d.recent), mix.on, i))));
  }
  root.replaceChildren(page);
  if (state.recs.length) root.append(section(d.total ? "Recommended" : "Popular now", null, gifts(state.recs)));
}

async function main() {
  document.body.prepend(backdrop());
  try { state.d = await api("/api/dashboard"); }
  catch (e) { document.getElementById("app").replaceChildren($("div", "err", "Open this page from the Telegram bot.")); return; }
  state.name = state.d.profile.name;
  state.tgName = state.d.profile.tg_name;
  state.avatar = state.d.profile.avatar;
  state.bg = state.d.profile.bg; setBackdrop();
  state.favs = state.d.favorites;
  if (state.name) { render(); maybeAutoplay(); } else welcome();

  try {
    state.recs = (await api("/api/recs")).items;
    if (state.name) render();  // recommendations are optional: the page is already usable without them
  } catch (e) { /* ignore */ }
}
main();
