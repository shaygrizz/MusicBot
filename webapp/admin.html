<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0E0916; --surface: #181022; --rule: #3B2E4D; --text: #F3EFF8; --text2: #BDB3CF;
    --rose: #E5608F; --gold: #D4B47A; --on-rose: #0E0916;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --t-meta: 13px; --t-body: 15px; --t-lead: 18px; --t-h1: 32px;
    --display: "Forum", "Georgia", serif;
    --sans: "Golos Text", system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 640px; padding: var(--s5) var(--s4) var(--s6); background: var(--bg); color: var(--text); font: 400 var(--t-body)/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  h1 { margin: 0; font: 400 var(--t-h1)/1.1 var(--display); }
  h2 { margin: var(--s6) 0 var(--s2); font: 400 var(--t-lead)/1.2 var(--display); color: var(--gold); }
  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
  .link { padding: var(--s2) 0; border: 0; background: none; color: var(--rose); font-weight: 500; cursor: pointer; }
  .muted { color: var(--text2); font-size: var(--t-meta); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: var(--s2) var(--s4); margin: var(--s3) 0 0; }
  .kv dt { color: var(--text2); }
  .kv dd { margin: 0; font-weight: 600; text-align: right; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: baseline; width: 100%; padding: var(--s3) 0; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .list > .row:last-of-type, .list > .more:last-child { border-bottom: 1px solid var(--rule); }
  .row .n { font-weight: 500; overflow-wrap: anywhere; }
  .row .m { color: var(--text2); font-size: var(--t-meta); }
  .row .c { color: var(--text2); font-size: var(--t-meta); white-space: nowrap; text-align: right; }
  .more { padding: var(--s2) 0 var(--s4) var(--s4); border-top: 1px solid var(--rule); }
  .more h3 { margin: var(--s3) 0 var(--s1); font: 600 var(--t-meta)/1.3 var(--sans); color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
  .more ul { margin: 0; padding: 0; list-style: none; }
  .more li { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); padding: var(--s1) 0; font-size: var(--t-meta); }
  .more li span:last-child { color: var(--text2); white-space: nowrap; }
  .err { padding: var(--s5) 0; color: var(--rose); }
  .id { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="app"><div class="muted">Loading…</div></main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0E0916"); tg.setBackgroundColor("#0E0916"); } catch (e) {} }

const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const api = async path => {
  const r = await fetch(path, { headers: { "X-Init-Data": tg ? tg.initData : "" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const when = ts => ts ? new Date(ts * 1000).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "never";
const ago = ts => {
  if (!ts) return "never";
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  if (m < 1440) return `${Math.floor(m / 60)} h ago`;
  return `${Math.floor(m / 1440)} d ago`;
};

function totals(t) {
  const dl = $("dl", "kv");
  [["Users", t.users], ["Active in 7 days", t.active_7d], ["Tracks played", t.plays],
   ["Last 24 hours", t.plays_24h], ["Last 7 days", t.plays_7d], ["Favorites saved", t.favorites]]
    .forEach(([k, v]) => dl.append($("dt", null, k), $("dd", null, String(v))));
  return dl;
}

function listItems(title, items, line) {
  const box = $("div"); box.append($("h3", null, title));
  if (!items.length) { box.append($("div", "muted", "Nothing yet.")); return box; }
  const ul = $("ul");
  items.forEach(it => { const li = $("li"), [a, b] = line(it); li.append($("span", null, a), $("span", null, b)); ul.append(li); });
  box.append(ul); return box;
}

function userRow(u, list) {
  const label = u.name || u.tg_name || "No name";
  const row = $("button", "row"), left = $("div"), right = $("div", "c");
  row.setAttribute("aria-expanded", "false");
  left.append($("div", "n", label), $("div", "m id", `ID ${u.id}${u.name && u.tg_name && u.name !== u.tg_name ? `, Telegram: ${u.tg_name}` : ""}`));
  right.append(document.createTextNode(`${u.plays} plays, ${u.favorites} fav`), document.createElement("br"), document.createTextNode(ago(u.last)));
  row.append(left, right);
  let more = null;
  row.onclick = async () => {
    if (more) { more.remove(); more = null; row.setAttribute("aria-expanded", "false"); return; }
    more = $("div", "more"); more.append($("div", "muted", "Loading…"));
    row.after(more); row.setAttribute("aria-expanded", "true");
    try {
      const d = await api(`/api/admin/user?id=${u.id}`);
      more.replaceChildren(
        $("div", "muted", `First seen ${when(u.first_seen)}. Photo: ${u.avatar ? "custom" : "default"}. Background: ${u.bg ? "custom" : "default"}.`),
        listItems("Favorites", d.favorites, f => [`${f.title}${f.artist ? `, ${f.artist}` : ""}`, ""]),
        listItems("Recent plays", d.plays, p => [`${p.title}${p.artist ? `, ${p.artist}` : ""}`, when(p.ts)]));
    } catch (e) { more.replaceChildren($("div", "err", "Could not load details.")); }
  };
  return row;
}

async function load() {
  const app = document.getElementById("app");
  let d;
  try { d = await api("/api/admin"); }
  catch (e) { app.replaceChildren($("div", "err", "Not available.")); return; }
  const head = $("div", "bar"), refresh = $("button", "link", "Refresh");
  refresh.onclick = load;
  head.append($("h1", null, "Admin"), refresh);
  const users = $("div", "list");
  if (!d.users.length) users.append($("div", "muted", "No users yet."));
  d.users.forEach(u => users.append(userRow(u)));
  const top = $("div", "list");
  d.top_tracks.forEach(t => {
    const row = $("div", "row"), left = $("div");
    left.append($("div", "n", t.title), $("div", "m", t.artist));
    row.append(left, $("div", "c", `${t.plays}`)); top.append(row);
  });
  app.replaceChildren(head, $("h2", null, "Totals"), totals(d.totals),
    $("h2", null, `Users (${d.users.length})`), users, $("h2", null, "Top tracks"), top);
}
load();
</script>
</body>
</html>
